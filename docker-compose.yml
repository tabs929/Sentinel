services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: sentinel:latest
    command: uvicorn sentinel.api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      SENTINEL_DB_PATH: /data/sentinel.db
    volumes:
      - sentinel-data:/data
    restart: unless-stopped

  dashboard:
    image: sentinel:latest
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      SENTINEL_DB_PATH: /data/sentinel.db
    volumes:
      - sentinel-data:/data
    depends_on:
      - api
    restart: unless-stopped

volumes:
  sentinel-data:
